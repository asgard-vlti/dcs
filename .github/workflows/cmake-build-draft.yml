name: CMake Build Check

on:
  push:
    # branches:
    #   - main
  pull_request:
  workflow_dispatch:

jobs:
  cmake-build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up newer CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.23.0'

      # Versions pinned to what is currently on mimir.
      # README dependency mapping to apt packages:
      # - cppzmq -> libzmq3-dev
      # - fftw -> build FFTW 3.3.10 from source to match the target machine's manual install
      # - tomlplusplus -> install single-header toml.hpp v3.4.0 to /usr/local/include
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export FFTW_VERSION=3.3.10
          export TOMLPP_VERSION=v3.4.0
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake=3.16.3* \
            ca-certificates=20240203* \
            curl=7.68.0* \
            pkg-config=0.29.1* \
            nlohmann-json3-dev=3.7.3* \
            libboost-all-dev=1.71.0.0* \
            libeigen3-dev=3.3.7* \
            libzmq3-dev=4.3.2* \
            libfmt-dev=6.1.2* \
            libcfitsio-dev=3.470* \
            libb64-dev=1.2* \
            gcc=4:9.3.0* \
            g++=4:9.3.0* \
            gcc-9=9.4.0* \
            g++-9=9.4.0* \
            tar=1.30* \
            gzip=1.10* \
            make=4.2.1*
          curl -fsSL "https://www.fftw.org/fftw-${FFTW_VERSION}.tar.gz" -o /tmp/fftw.tar.gz
          tar -xzf /tmp/fftw.tar.gz -C /tmp
          cd "/tmp/fftw-${FFTW_VERSION}"
          ./configure --prefix=/usr/local CC=gcc-9 --disable-doc --disable-fortran
          make -j"$(nproc)"
          make install
          echo /usr/local/lib > /etc/ld.so.conf.d/fftw-local.conf
          ldconfig
          curl -fsSL "https://raw.githubusercontent.com/marzer/tomlplusplus/${TOMLPP_VERSION}/toml.hpp" -o /usr/local/include/toml.hpp

      - name: Configure (top-level CMake)
        run: |
          export CC=gcc-9
          export CXX=g++-9
          cmake -S . -B build

      - name: Build (top-level CMake)
        run: cmake --build build

      - name: Build non-CMake targets (Makefiles)
        run: |
          export CC=gcc-9
          export CXX=g++-9

          # Build standalone commander and ImageStreamIO libraries used by legacy Makefiles.
          make -C commander/src clean all
          make -C libImageStreamIO clean all
          cp libImageStreamIO/libImageStreamIO.a lib/libImageStreamIO.a

          # Build independent make targets that are not covered by top-level CMake.
          make -C commander/examples/src clean all
          make -C baldr_jcr clean all
          make -C baldr clean all
          make -C baldr_tt clean all

          # Heimdallr Makefile does not include all header search paths by default.
          make -C heimdallr clean all \
            CFLAGS='-std=c++17 -Wall -Wextra -ggdb -O1 -I../commander/include -I../libImageStreamIO -I/usr/local/include -I/usr/include/eigen3' \
            LDFLAGS='-L../lib -lcommander -lm -lzmq -lImageStreamIO -lb64 -lpthread -lboost_program_options -lfmt -lfftw3'

          # These targets require vendor SDKs that are not available on stock GitHub runners.
          if [ -d '/opt/Boston Micromachines' ]; then
            make -C asgard-dm-server clean all
          else
            echo '::warning::Skipping asgard-dm-server build: /opt/Boston Micromachines SDK not present'
          fi

          if [ -d '/opt/EDTpdv' ]; then
            make -C asgard-cred1-server clean all
          else
            echo '::warning::Skipping asgard-cred1-server build: /opt/EDTpdv SDK not present'
          fi
