name: CMake Build Check

on:
  push:
    # branches:
    #   - main
  pull_request:
  workflow_dispatch:

jobs:
  cmake-build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Versions pinned to what is currently on mimir.
      # README dependency mapping to apt packages:
      # - cppzmq -> libzmq3-dev
      # - fftw -> libfftw3-double3 + libfftw3-single3 (as present in 00_apt_packages_installed.txt)
      # - tomlplusplus is not present in 00_apt_packages_installed.txt and is not installed here.
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake=3.16.3-1ubuntu1.20.04.1 \
            nlohmann-json3-dev=3.7.3-1 \
            libboost-all-dev=1.71.0.0ubuntu2 \
            libzmq3-dev=4.3.2-2ubuntu1 \
            libfmt-dev=6.1.2+ds-2 \
            libfftw3-double3=3.3.8-2ubuntu1 \
            libfftw3-single3=3.3.8-2ubuntu1 \
            libcfitsio-dev=3.470-3 \
            libb64-dev=1.2-5 \
            gcc-9=9.4.0 \
            g++-9=9.4.0 \
            make=4.2.1 \

      - name: Configure (top-level CMake)
        run: cmake -B build

      - name: Build
        run: cmake --build build
