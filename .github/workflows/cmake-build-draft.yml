name: CMake Build Check

on:
  push:
    # branches:
    #   - main
  pull_request:
  workflow_dispatch:

jobs:
  cmake-build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Versions pinned to what it currently on mimir
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          awk '
            /^Listing\.\.\./ { next }
            /^[^[:space:]]+\// {
              split($1, a, "/")
              pkg = a[1]
              ver = $2
              if (length(pkg) > 0 && length(ver) > 0) {
                print pkg "=" ver
              }
            }
          ' 00_apt_packages_installed.txt | sort -u > /tmp/all-packages.txt
          test -s /tmp/all-packages.txt
          echo "Extracted $(wc -l < /tmp/all-packages.txt) package/version entries from 00_apt_packages_installed.txt"
          xargs -r -a /tmp/all-packages.txt -n 50 apt-get install -y --no-install-recommends

      - name: Configure (top-level CMake)
        run: cmake -B build

      - name: Build
        run: cmake --build build
